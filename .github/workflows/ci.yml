name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # マイグレーションが実際に適用できること、および担当外・他事務所のデータへ
      # 到達できないこと（要件N-01/N-02）をDB層で検証する。
      # 画面のテストでは確かめられない層であり、実際にここで
      # 「作業者が担当外の案件を閲覧できる」不具合を検出している。
      - name: Verify migrations and access control
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql postgresql-client
          sudo bash scripts/verify-db.sh
        env:
          PG_BIN: /usr/lib/postgresql/16/bin

      - name: Build
        run: pnpm build

      # E2Eは本番ビルドに対して実ブラウザで動かす。フィクスチャ画面はDBを使わ
      # ないため、Supabaseの実接続なしで家系図エディタの挙動を検証できる。
      # （devサーバーはルートの遅延コンパイルでテストが不安定になるため使わない）
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E test
        run: pnpm e2e

      - name: Upload E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
